name: CI - Test Suite

# =============================================================================
# CI TEST ARCHITECTURE - READ BEFORE MODIFYING
# =============================================================================
#
# CRITICAL: Pytest runs unittest-based tests natively!
# DO NOT run both pytest and unittest on the same test files.
# This doubles CI time and provides no benefit.
#
# ❌ WRONG (runs tests twice):
#    coverage run -m pytest tests/
#    coverage run --append -m unittest discover -s tests
#
# ✅ CORRECT (pytest handles both):
#    coverage run -m pytest tests/
#
# TEST MARKERS (pyproject.toml):
# Dev runs: `pytest` (excludes optional by default via addopts)
# CI runs:  `pytest -m ""` (includes ALL tests)
#
# Markers: optional, fuzz, mcp, protobuf, slow
# Tests marked 'optional' require dependencies like hypothesis, mcp, protobuf
#
# PARALLEL ARCHITECTURE (optimized for speed, aligned with Metus philosophy):
#
#   validate-tasks       smoke-tests      showcase
#        (< 5s)           (< 30s)         (parallel)
#          │                 │                │
#          │                 ├────────────────┼─────────────────────┐
#          │                 │                │                     │
#          ▼                 ▼                ▼                     ▼
#    (continues)  ┌─────────────────────────────────────┐    ┌──────────────────┐
#                 │ unit-tests ────────────┐            │    │ performance-tests│
#                 │ integration-tests ─────┼── (cov) ───│    │ contract-tests   │ ← Sacred
#                 │ behavioral-tests ──────┤            │    │ project-tests    │   promises
#                 │ regression-tests ──────┘            │    └──────────────────┘
#                 └───────────────┬─────────────────────┘        (no coverage -
#                                 │                               timing sensitive)
#                                 ├───────────────┐
#                                 │               │
#                                 ▼               ▼
#                          coverage-report  ml-test-calibration
#                        (combines coverage   (processes test results
#                         from ALL 4 jobs      for ML calibration,
#                         = TRUE coverage)     non-blocking)
#
# PROJECT TESTS (cortical/projects/):
# - Run independently of core tests
# - Use continue-on-error: true (failures don't block CI)
# - Install project-specific deps: pip install -e ".[mcp]"
#
# Each stage runs specific test files to avoid duplication.
# coverage-report ONLY combines coverage data - it does NOT run tests again.
# =============================================================================

on:
  push:
    branches:
      - '**'  # Run on all branch pushes (explicit)
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering
    inputs:
      run_ml_jobs:
        description: 'Run ML data collection jobs'
        required: false
        default: 'false'
        type: boolean
      run_security_scan:
        description: 'Run security scanning'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Stage 0: Task Validation (< 5s)
  # Quick check for valid task files in tasks/ directory - runs in parallel with smoke
  # ==========================================================================
  validate-tasks:
    name: "📋 Validate Tasks"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install base package
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Validate GoT State
      run: |
        echo "=== Validating GoT State ==="
        python -m cortical.got validate
        echo "✅ GoT validation passed"

    - name: Report Pending Tasks
      if: always()
      run: |
        echo "=== Pending Tasks Report ==="
        python scripts/ci_task_report.py --github
      env:
        GITHUB_STEP_SUMMARY: ${{ github.step_summary }}

  # ==========================================================================
  # Stage 1: Smoke Tests (< 30s)
  # Quick sanity check - if this fails, something is fundamentally broken
  # ==========================================================================
  smoke-tests:
    name: "💨 Smoke Tests"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run smoke tests
      run: |
        echo "=== Running Smoke Tests ==="
        # -m "" overrides pyproject.toml addopts to include optional tests in CI
        python -m pytest tests/smoke/ -m "" -v --tb=short
        echo "✅ Smoke tests passed"

  # ==========================================================================
  # Stage 2: Unit Tests with Coverage (< 2 min)
  # Fast, isolated tests for individual components
  # Runs in PARALLEL with integration-tests after smoke-tests pass
  # ==========================================================================
  unit-tests:
    name: "🧪 Unit Tests"
    runs-on: ubuntu-latest
    needs: smoke-tests
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run unit tests with coverage
      run: |
        echo "=== Running Unit Tests ==="
        # Run unit tests - pytest handles both pytest AND unittest style tests
        # Using a single pytest call is faster than multiple unittest discovers
        # Note: Legacy tests removed 2025-12-13 - now covered by tests/unit/
        # -m "" overrides pyproject.toml addopts to include optional tests in CI
        # --junit-xml generates machine-readable results for TestExpert calibration
        #
        # Includes:
        # - tests/unit/: Core unit tests
        # - tests/benchmarks/: SLM model regression tests (prevent training regressions)
        # - tests/hubris/: Hubris expert tests (RefactorExpert, etc.)
        coverage run --source=cortical -m pytest \
          tests/unit/ \
          tests/benchmarks/ \
          tests/hubris/ \
          -m "" \
          -v --tb=short \
          --junit-xml=pytest-unit-results.xml

        coverage report --include="cortical/*"

    - name: Upload unit test coverage data
      uses: actions/upload-artifact@v4
      with:
        name: coverage-unit
        path: .coverage
        # Rename to avoid collision when combining
        include-hidden-files: true

    - name: Upload unit test results for ML calibration
      if: always()  # Upload even if tests fail
      uses: actions/upload-artifact@v4
      with:
        name: pytest-unit-results
        path: pytest-unit-results.xml

  # ==========================================================================
  # Stage 3: Integration Tests (< 3 min)
  # Tests for component interactions
  # Runs in PARALLEL with unit-tests after smoke-tests pass
  # ==========================================================================
  integration-tests:
    name: "🔗 Integration Tests"
    runs-on: ubuntu-latest
    needs: smoke-tests  # Changed: runs parallel with unit-tests
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run integration tests with coverage
      run: |
        echo "=== Running Integration Tests ==="
        # Run integration tests - single pytest call is faster than multiple unittest discovers
        # Includes tests/integration/ plus remaining legacy tests that provide unique coverage
        # Note: 3 legacy tests removed 2025-12-13 (test_behavioral.py, test_intent_query.py,
        #       test_query_optimization.py) - now covered by unit tests
        # -m "" overrides pyproject.toml addopts to include optional tests in CI
        # Note: MCP tests moved to project-tests job (runs separately, can fail independently)
        # --junit-xml generates machine-readable results for TestExpert calibration
        coverage run --source=cortical -m pytest \
          tests/integration/ \
          tests/test_incremental_indexing.py \
          tests/test_edge_cases.py \
          tests/test_coverage_gaps.py \
          tests/test_analyze_louvain_resolution.py \
          tests/test_evaluate_cluster.py \
          tests/test_cli_wrapper.py \
          tests/test_search_codebase.py \
          tests/test_ask_codebase.py \
          tests/test_generate_ai_metadata.py \
          tests/test_showcase.py \
          tests/security/ \
          -m "" \
          -v --tb=short \
          --junit-xml=pytest-integration-results.xml

        coverage report --include="cortical/*"

    - name: Upload integration test coverage data
      uses: actions/upload-artifact@v4
      with:
        name: coverage-integration
        path: .coverage
        include-hidden-files: true

    - name: Upload integration test results for ML calibration
      if: always()  # Upload even if tests fail
      uses: actions/upload-artifact@v4
      with:
        name: pytest-integration-results
        path: pytest-integration-results.xml

  # ==========================================================================
  # Stage 4: Regression Tests (< 1 min)
  # Tests for specific bugs that were fixed
  # Runs in PARALLEL with unit/integration after smoke-tests pass
  # NOW WITH COVERAGE: Contributes to combined coverage report
  # ==========================================================================
  regression-tests:
    name: "🔒 Regression Tests"
    runs-on: ubuntu-latest
    needs: smoke-tests  # Changed: runs parallel, only needs smoke
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run regression tests with coverage
      run: |
        echo "=== Running Regression Tests ==="
        # -m "" overrides pyproject.toml addopts to include optional tests in CI
        coverage run --source=cortical -m pytest tests/regression/ -m "" -v --tb=short
        echo "✅ All regressions still fixed"

    - name: Upload regression test coverage data
      uses: actions/upload-artifact@v4
      with:
        name: coverage-regression
        path: .coverage
        include-hidden-files: true

  # ==========================================================================
  # Stage 5: Behavioral Tests (< 2 min)
  # Tests for user-facing quality and relevance
  # Runs in PARALLEL with unit/integration after smoke-tests pass
  # NOW WITH COVERAGE: Contributes to combined coverage report
  # These tests are living documentation (Metus philosophy) and test modules
  # like prism_causal, cel/sanity/*, etc. that are primarily behavioral.
  # ==========================================================================
  behavioral-tests:
    name: "🎯 Behavioral Tests"
    runs-on: ubuntu-latest
    needs: smoke-tests  # Changed: runs parallel, only needs smoke
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run behavioral tests with coverage
      run: |
        echo "=== Running Behavioral Tests ==="
        # Note: tests/test_behavioral.py removed 2025-12-13 - superseded by tests/behavioral/
        # -m "" overrides pyproject.toml addopts to include optional tests in CI
        # Coverage collected here includes modules primarily tested via behavioral tests:
        # - cortical/reasoning/prism_causal.py (~71% coverage)
        # - cortical/cel/sanity/* (compaction, health, migration)
        # - cortical/reasoning/prism_attention.py
        coverage run --source=cortical -m pytest tests/behavioral/ -m "" -v --tb=short
        echo "✅ Behavioral quality verified"

    - name: Upload behavioral test coverage data
      uses: actions/upload-artifact@v4
      with:
        name: coverage-behavioral
        path: .coverage
        include-hidden-files: true

  # ==========================================================================
  # Stage 6: Performance Tests (< 1 min, no coverage)
  # Timing-based tests to catch performance regressions
  # Runs in PARALLEL with unit/integration after smoke-tests pass
  # ==========================================================================
  performance-tests:
    name: "⏱️ Performance Tests"
    runs-on: ubuntu-latest
    needs: smoke-tests  # Changed: runs parallel, only needs smoke
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run performance tests
      run: |
        echo "=== Running Performance Tests (no coverage) ==="
        # -m "" overrides pyproject.toml addopts to include optional tests in CI
        # Excludes contract tests (run separately in contract-tests job)
        python -m pytest tests/performance/ -m "not contract" -v --tb=short -s
        echo "✅ Performance within thresholds"

  # ==========================================================================
  # Stage 6b: Performance Contracts (Sacred Promises)
  # These are GUARANTEES we make about system performance.
  # Contract violations BLOCK the build - no exceptions.
  # Renegotiating a contract requires team review + documented justification.
  # ==========================================================================
  contract-tests:
    name: "📜 Performance Contracts"
    runs-on: ubuntu-latest
    needs: smoke-tests
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run performance contracts
      run: |
        echo "╔══════════════════════════════════════════════════════════════╗"
        echo "║              PERFORMANCE CONTRACT VERIFICATION               ║"
        echo "║                                                              ║"
        echo "║  These are sacred promises. Violations block the build.     ║"
        echo "║  To renegotiate: document why + get team review.            ║"
        echo "╚══════════════════════════════════════════════════════════════╝"
        echo ""
        # Run ONLY contract-marked tests
        python -m pytest tests/performance/contracts/ -m contract -v --tb=long
        echo ""
        echo "✅ All performance contracts honored"

  # ==========================================================================
  # Stage 7: Project Tests (Optional - Can Fail Independently)
  # Tests for optional projects (MCP, Proto, CLI)
  # These tests are isolated and DO NOT block core CI
  # ==========================================================================
  project-tests:
    name: "📦 Project Tests (MCP)"
    runs-on: ubuntu-latest
    needs: smoke-tests
    continue-on-error: true  # Projects can fail without blocking CI
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install project dependencies
      run: |
        python -m pip install --upgrade pip
        # Install MCP project dependencies specifically
        pip install -e ".[mcp,dev]"

    - name: Run MCP project tests
      run: |
        echo "=== Running MCP Project Tests ==="
        echo "Note: These tests are isolated and can fail independently"
        # Run tests from the new project location
        python -m pytest cortical/projects/mcp/tests/ -m "" -v --tb=short || {
          echo "⚠️ MCP project tests failed (this is allowed)"
          # Also try the old location for backward compatibility
          if [ -f "tests/test_mcp_server.py" ]; then
            echo "Trying legacy test location..."
            python -m pytest tests/test_mcp_server.py -m "" -v --tb=short || true
          fi
        }
        echo "📦 MCP project tests complete"

  # ==========================================================================
  # Stage 8: Full Coverage Report
  # Combines coverage from ALL test jobs that collect coverage:
  # - unit-tests, integration-tests, behavioral-tests, regression-tests
  # This gives us TRUE coverage measurement across all test types.
  # ==========================================================================
  coverage-report:
    name: "📊 Coverage Report"
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, behavioral-tests, regression-tests]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install coverage
      run: |
        python -m pip install --upgrade pip
        pip install coverage

    - name: Download unit coverage
      uses: actions/download-artifact@v4
      with:
        name: coverage-unit
        path: coverage-unit

    - name: Download integration coverage
      uses: actions/download-artifact@v4
      with:
        name: coverage-integration
        path: coverage-integration

    - name: Download behavioral coverage
      uses: actions/download-artifact@v4
      with:
        name: coverage-behavioral
        path: coverage-behavioral

    - name: Download regression coverage
      uses: actions/download-artifact@v4
      with:
        name: coverage-regression
        path: coverage-regression

    - name: Combine coverage data and generate report
      run: |
        echo "=== Combining Coverage Data ==="
        # ⚠️  IMPORTANT: This job ONLY combines coverage - NO test runs!
        #
        # Tests were already run in parallel test jobs.
        # Running tests again here would double CI time.
        #
        # We use 'coverage combine' to merge the .coverage files from:
        # - unit-tests: Core unit tests
        # - integration-tests: Component integration + legacy tests
        # - behavioral-tests: User story tests (Metus living documentation)
        # - regression-tests: Bug-specific regression tests
        #
        # This gives TRUE coverage - no modules hidden or excluded artificially.

        # Move coverage files to current directory with unique names
        mv coverage-unit/.coverage .coverage.unit
        mv coverage-integration/.coverage .coverage.integration
        mv coverage-behavioral/.coverage .coverage.behavioral
        mv coverage-regression/.coverage .coverage.regression

        # Combine coverage data from ALL jobs
        coverage combine .coverage.unit .coverage.integration .coverage.behavioral .coverage.regression

        # Generate reports
        echo "=== Coverage Report ==="
        coverage report -m --include="cortical/*"
        coverage xml -o coverage.xml

        # Check threshold (fail if below 86%)
        # Temporarily lowered from 88% to verify CI infrastructure changes
        # TODO: Restore to 88% after confirming contracts/gates work
        #
        # MINIMAL EXCLUSIONS (only truly optional/separate modules):
        # - cortical/projects/*: Optional projects, tested separately in project-tests
        # - cortical/mcp_server.py: MCP shim, tested in project-tests
        #
        # Note: With behavioral coverage now combined, we no longer need to exclude
        # prism_causal, prism_attention, cel/sanity/*, etc. - they have real coverage!
        coverage report --fail-under=86 --include="cortical/*" --omit="cortical/projects/*,cortical/mcp_server.py"
        echo "✅ Coverage threshold met"

    - name: Upload final coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

  # ==========================================================================
  # Showcase - REMOVED from CI (runs on-demand via showcase.yml)
  # Use: gh workflow run showcase.yml
  # ==========================================================================

  # ==========================================================================
  # Security Scanning (on-demand only)
  # Static analysis and dependency scanning for security vulnerabilities
  # Run with: gh workflow run ci.yml -f run_security_scan=true
  # ==========================================================================
  security-scan:
    name: "🔐 Security Scan"
    runs-on: ubuntu-latest
    if: github.event.inputs.run_security_scan == 'true'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit pip-audit detect-secrets

    - name: Run Bandit (SAST)
      run: |
        echo "=== Running Bandit Static Analysis ==="
        # -ll = only show medium and higher severity issues
        # -r = recursive
        # Skip B101 (assert) as we use asserts for invariants in non-production code
        bandit -r cortical/ -ll -s B101 -f txt || true
        echo "✅ Bandit scan complete"

    - name: Run pip-audit (Dependency Scanning)
      run: |
        echo "=== Running pip-audit Dependency Check ==="
        pip install -e ".[dev]"
        pip-audit --desc || echo "⚠️ Review dependency vulnerabilities above"

    - name: Run detect-secrets (Secret Scanning)
      run: |
        echo "=== Running detect-secrets ==="
        # Scan for accidentally committed secrets
        detect-secrets scan --all-files --exclude-files '\.git/.*' --exclude-files '.*\.pkl' --exclude-files '.*\.json' > .secrets-baseline.json || true
        # Check if any high-entropy secrets were found (excluding test fixtures)
        python3 << 'PYTHON_SCRIPT'
        import json
        with open('.secrets-baseline.json') as f:
            data = json.load(f)
            results = data.get('results', {})
            real_secrets = {k: v for k, v in results.items() if not k.startswith('tests/')}
            if real_secrets:
                print('⚠️ Potential secrets found in:')
                for file in real_secrets:
                    print(f'  - {file}')
                print('Please review and ensure no real secrets are committed.')
            else:
                print('✅ No secrets detected in source files')
        PYTHON_SCRIPT

  # ==========================================================================
  # Markdown Link Checker (runs in parallel with all other jobs)
  # Uses our own Python script - NO external dependencies/actions
  # Principle: Prefer native implementations over 3rd party APIs/actions
  # ==========================================================================
  markdown-links:
    name: "🔗 Markdown Links"
    runs-on: ubuntu-latest
    continue-on-error: true  # Non-blocking initially
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Check wiki-links in markdown files
      run: |
        echo "Checking wiki-links in documentation..."
        python scripts/resolve_wiki_links.py --check docs/ || true
        python scripts/resolve_wiki_links.py --check samples/memories/ || true
        python scripts/resolve_wiki_links.py --check samples/decisions/ || true
        echo "Link check complete (informational only)"

  # ==========================================================================
  # ML TestExpert Calibration: Post-Test Feedback (on-demand only)
  # Processes test results to calibrate TestExpert confidence predictions
  # Run with: gh workflow run ci.yml -f run_ml_jobs=true
  # ==========================================================================
  ml-test-calibration:
    name: "🎓 ML TestExpert Calibration"
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always() && github.event.inputs.run_ml_jobs == 'true'
    continue-on-error: true  # Non-blocking - don't fail CI if calibration fails
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Download unit test results
      uses: actions/download-artifact@v4
      with:
        name: pytest-unit-results
        path: test-results
      continue-on-error: true  # May not exist if unit tests didn't run

    - name: Download integration test results
      uses: actions/download-artifact@v4
      with:
        name: pytest-integration-results
        path: test-results
      continue-on-error: true  # May not exist if integration tests didn't run

    - name: Process test results for TestExpert calibration
      run: |
        echo "=== Processing Test Results for TestExpert Calibration ==="

        # Check if the test_feedback.py script exists
        if [[ ! -f "scripts/hubris/test_feedback.py" ]]; then
          echo "ℹ️  TestExpert not available (scripts/hubris/test_feedback.py not found)"
          echo "   Skipping calibration data collection"
          exit 0
        fi

        # Check if ML collection is enabled (default: yes)
        if [[ "${ML_COLLECTION_ENABLED:-1}" == "0" ]]; then
          echo "ℹ️  ML collection disabled via ML_COLLECTION_ENABLED=0"
          exit 0
        fi

        # Process each XML file
        shopt -s nullglob  # Don't error if no matches
        for xml_file in test-results/*.xml; do
          if [[ -f "$xml_file" ]]; then
            echo ""
            echo "Processing: $xml_file"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # Copy to project root with a name the hook will find
            # The hook looks for pytest-results.xml, test-results.xml, etc.
            cp "$xml_file" pytest-results.xml

            # Set env var to explicitly point to the file
            export PYTEST_OUTPUT_FILE=pytest-results.xml

            # Run the post-test hook script (handles both text and XML)
            bash scripts/ml-post-test-hook.sh || {
              echo "⚠️  Post-test hook failed for $xml_file (non-blocking)"
            }

            # Clean up for next iteration
            rm -f pytest-results.xml
          fi
        done

        echo ""
        echo "✅ TestExpert calibration processing complete"

    - name: Report calibration status
      if: always()
      run: |
        echo "=== TestExpert Calibration Status ==="
        if [[ -d ".git-ml/test_feedback" ]]; then
          echo "📊 Calibration data saved to .git-ml/test_feedback/"
          ls -lh .git-ml/test_feedback/ | tail -5 || true
        else
          echo "ℹ️  No calibration data generated (TestExpert may not be configured)"
        fi

  # ==========================================================================
  # ML Data Collection: CI Result Auto-Capture (on-demand only)
  # Records test results for model training
  # Run with: gh workflow run ci.yml -f run_ml_jobs=true
  # ==========================================================================
  ml-ci-capture:
    name: "📊 ML CI Capture"
    runs-on: ubuntu-latest
    needs: [coverage-report]
    if: always() && github.event.inputs.run_ml_jobs == 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for commit lookup

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Capture CI results for ML training
      env:
        CI_RESULT: ${{ needs.coverage-report.result == 'success' && 'pass' || 'fail' }}
        CI_COVERAGE: ${{ needs.coverage-report.outputs.coverage || '' }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_WORKFLOW: ${{ github.workflow }}
        GITHUB_JOB: ${{ github.job }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_NUMBER: ${{ github.run_number }}
      run: |
        echo "=== Recording CI Results for ML Training ==="
        echo "Commit: $GITHUB_SHA"
        echo "Result: $CI_RESULT"

        # Ensure .git-ml directory exists
        mkdir -p .git-ml/commits

        # Try to record the result (may fail if commit not in data yet)
        python scripts/ml_data_collector.py ci-autocapture || echo "Note: Commit may not be in ML data yet"

        echo "=== ML CI Capture Complete ==="

  # ==========================================================================
  # ML Data Collection: Stats Report (on-demand only)
  # Shows current progress toward ML training data goals
  # Run with: gh workflow run ci.yml -f run_ml_jobs=true
  # ==========================================================================
  ml-stats-report:
    name: "📈 ML Stats Report"
    runs-on: ubuntu-latest
    needs: [ml-ci-capture]
    if: always() && github.event.inputs.run_ml_jobs == 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for accurate stats

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Generate ML Data Collection Report
      run: |
        echo "=== ML Data Collection Progress ==="

        # Run stats report
        python scripts/ml_data_collector.py stats

        echo ""
        echo "=== Training Timeline Estimate ==="

        # Run estimate report
        python scripts/ml_data_collector.py estimate

    - name: Write GitHub Summary
      run: |
        echo "## 📊 ML Data Collection Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Capture stats in a format suitable for markdown
        python3 << 'PYTHON_SCRIPT' >> $GITHUB_STEP_SUMMARY
        import sys
        sys.path.insert(0, 'scripts')

        try:
            from ml_collector.config import (
                COMMITS_DIR, COMMITS_LITE_FILE, SESSIONS_LITE_FILE,
                CHATS_DIR, ACTIONS_DIR, SESSIONS_DIR
            )
            from pathlib import Path

            # Count data files
            commits_full = len(list(COMMITS_DIR.glob("*.json"))) if COMMITS_DIR.exists() else 0
            commits_lite = sum(1 for _ in open(COMMITS_LITE_FILE)) if COMMITS_LITE_FILE.exists() else 0
            sessions_lite = sum(1 for _ in open(SESSIONS_LITE_FILE)) if SESSIONS_LITE_FILE.exists() else 0
            chats = sum(1 for d in CHATS_DIR.iterdir() if d.is_dir() for f in d.glob("*.json")) if CHATS_DIR.exists() else 0

            # Calculate progress
            commit_target = 5000
            chat_target = 5000
            commit_pct = min(100, (commits_lite / commit_target) * 100)
            chat_pct = min(100, (chats / chat_target) * 100)

            print("### Current Progress")
            print("")
            print("| Metric | Current | Target | Progress |")
            print("|--------|---------|--------|----------|")
            print(f"| Commits (lite) | {commits_lite:,} | {commit_target:,} | {commit_pct:.1f}% |")
            print(f"| Commits (full) | {commits_full:,} | {commit_target:,} | {(commits_full/commit_target)*100:.1f}% |")
            print(f"| Chats | {chats:,} | {chat_target:,} | {chat_pct:.1f}% |")
            print(f"| Sessions (lite) | {sessions_lite:,} | 2,000 | {(sessions_lite/2000)*100:.1f}% |")
            print("")

            # Estimate time
            if commits_lite > 0:
                # Rough estimate based on repo age and commits
                days_estimate = int((commit_target - commits_lite) / max(1, commits_lite / 30) * 30)
                print(f"### Timeline Estimate")
                print(f"")
                print(f"At current collection rate: **~{days_estimate} days** to reach commit target")
                print("")

            print("### Training Milestones")
            print("")
            file_pred_ready = commits_lite >= 500 and chats >= 200
            commit_msg_ready = commits_lite >= 2000 and chats >= 1000
            code_sugg_ready = commits_lite >= 5000 and chats >= 5000

            print(f"- {'✅' if file_pred_ready else '⬜'} **File Prediction** (500 commits, 200 chats)")
            print(f"- {'✅' if commit_msg_ready else '⬜'} **Commit Messages** (2,000 commits, 1,000 chats)")
            print(f"- {'✅' if code_sugg_ready else '⬜'} **Code Suggestions** (5,000 commits, 5,000 chats)")

        except Exception as e:
            print(f"*Could not generate detailed stats: {e}*")
        PYTHON_SCRIPT
